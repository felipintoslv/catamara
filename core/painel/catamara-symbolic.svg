<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Logo oficial Catamara: evolucao da Jangada com casco duplo e duas velas paralelas (Argon e Flash) -->
  <g fill="currentColor">
    <!-- Casco Esquerdo (Casco 1) -->
    <rect x="2" y="18" width="8" height="2" rx="0.5"/>
    <path d="M2 18 C2 19 4 20.5 7 20.5 L10 20.5 L10 18 Z" opacity="0.6"/>
    <!-- Mastro e Vela do Casco 1 (Argon) -->
    <rect x="7" y="5" width="1" height="13"/>
    <path d="M8 5.5 C9 9 10.5 11.5 12.5 13 H8 Z"/>

    <!-- Ponte de Ligacao / Longarina Central -->
    <rect x="7" y="16.5" width="10" height="1.2" rx="0.3" opacity="0.8"/>

    <!-- Casco Direito (Casco 2) -->
    <rect x="14" y="18" width="8" height="2" rx="0.5"/>
    <path d="M14 18 C14 19 16 20.5 19 20.5 L22 20.5 L22 18 Z" opacity="0.6"/>
    <!-- Mastro e Vela do Casco 2 (Flash) -->
    <rect x="19" y="3" width="1" height="15"/>
    <path d="M20 3.5 C21 8 22 11 23.5 13 H20 Z"/>
    
    <!-- Onda inferior sutil -->
    <path d="M1 22 C3 21.5 5 22.5 7 22 C9 21.5 11 22.5 13 22 C15 21.5 17 22.5 19 22 C21 21.5 23 22.5 24 22" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
